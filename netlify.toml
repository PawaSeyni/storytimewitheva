[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Force the legacy netlify.app subdomain to redirect to the custom domain.
# (Netlify's automatic "primary domain" redirect doesn't always engage; this
# explicit rule is version-controlled and reliable. Uses `force = true` to
# override any static match.)
[[redirects]]
  from = "https://storytimewitheva.netlify.app/*"
  to = "https://storytimewitheva.com/:splat"
  status = 301
  force = true

# No SPA catch-all on purpose. Every real route (incl. /es,/fr variants, all book
# pages, and the noindex /profile,/search) is prerendered to its own static
# index.html by scripts/prerender.mjs, so unmatched URLs fall through to Netlify's
# auto-served dist/404.html (real HTTP 404) instead of the home page (soft-404).
# The prerender step is REQUIRED: if it fails, the build fails and the last good
# deploy stays live, so removing this fallback never leaves real routes unserved.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP — ENFORCED. Validated Report-Only first (2026-08-22) across home, /books,
    # a book detail, a React game, a standalone inline-script game, and both
    # landing pages incl. the signup submit: zero resource violations.
    # `'unsafe-inline'` in script-src is required because all 12 games use inline
    # <script>/onclick; the value here is locking script/img/connect to known
    # origins (self + Plausible + Amazon covers) and killing object/base/frame/
    # form-action vectors. No eval, no iframes. External loads: Plausible
    # (script+connect) and m.media-amazon.com (cover images).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://m.media-amazon.com; font-src 'self' data:; connect-src 'self' https://plausible.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Deploy provenance (scripts/gen-version.mjs). MUST NOT be cached: a stale copy
# would report the PREVIOUS deploy's commit and make the verification chain lie
# in the one direction that matters. `npm run verify:deploy` reads this.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Long-cache for hashed static assets emitted by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lead-magnet PDFs are content-hashed (`<slug>.<hash>.pdf`, served via the stable
# /download/<slug> 302), so a replaced file always gets a new filename — safe to
# pin immutably for a year. Without this they fell under the default and were
# re-fetched/revalidated on every download (each is multiple MB).
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public root images (previews, favicon, OG) are NOT content-hashed, so they must
# NOT be immutable — a replaced file (e.g. a re-rendered /previews/*.webp) has to
# be able to propagate. 1 day + revalidate keeps them cached without pinning a
# stale image for a year. (Vite's hashed assets under /assets/* stay immutable.)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Lighthouse audit runs after every successful deploy.
# Reports go to the deploy summary in the Netlify dashboard.
# No thresholds set on this first pass — just collect scores. Once we know
# what's realistic for this site, tighten thresholds so regressions fail builds.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

  [[plugins.inputs.audits]]
    path = "/"

  [[plugins.inputs.audits]]
    path = "books"

  [[plugins.inputs.audits]]
    path = "activities"

  [[plugins.inputs.audits]]
    path = "activities/story-builder"

  [[plugins.inputs.audits]]
    path = "about"

# CORS for hosted pin assets (Pinterest composer automation fetches these)
[[headers]]
  for = "/pins/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
