# S8-011 / S8-018: automated post-deploy and scheduled production checks.
#
# - On every push to main: wait until production reports the pushed commit in
#   /version.json (Netlify builds in ~1 min), then run the deploy verification and the
#   production smoke suite. A failure here is the "rollback" signal (see the DR runbook).
# - Every 6 hours: the same checks as uptime/route monitoring.
# - Daily: the full client-side audit against production (a11y, cookie-free, seasonal,
#   search, print, landing). Results are uploaded as artifacts and retained 90 days.
# Alerts: GitHub emails the repository owner on a failed run (default notification).
name: post-deploy
on:
  push: { branches: [main] }
  schedule:
    - cron: '17 */6 * * *'   # every 6 h
    - cron: '43 5 * * *'     # daily full audit
  workflow_dispatch:
jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # This waited 10 minutes and then failed. Failing is right, but it left a
      # stale production site standing until someone read the email: on
      # griotmoon.com on 2026-10-21 a push produced no Netlify build at all (PR
      # preview fine, site settings untouched, zero Netlify statuses on the
      # merge commit), and the shared Netlify team does the same thing silently
      # when its credits run out. So the wait now has a recovery step: fire the
      # build hook once, wait again, and only then fail.
      - name: Wait for production to serve this commit (push only, unless the commit skips Netlify)
        id: first
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip netlify]')
        run: |
          for i in $(seq 1 32); do   # 32 x 15s = 8 minutes
            live=$(curl -s https://storytimewitheva.com/version.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; echo "live: $live"; exit 0; fi
            sleep 15
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No production deploy for $GITHUB_SHA after 8 minutes. Firing the Netlify build hook."

      - name: Fire the Netlify build hook
        if: steps.first.outputs.live == 'false'
        env: { HOOK: '${{ secrets.NETLIFY_BUILD_HOOK }}' }
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is not set, so the deploy cannot be recovered automatically."; exit 1
          fi
          curl -fsS -X POST -d '{}' "$HOOK" && echo "Build hook accepted."

      - name: Wait for the recovered deploy
        if: steps.first.outputs.live == 'false'
        run: |
          for i in $(seq 1 60); do   # 60 x 15s = 15 minutes
            live=$(curl -s https://storytimewitheva.com/version.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Production is on $GITHUB_SHA after the build hook."; exit 0; fi
            sleep 15
          done
          echo "::error::Build hook fired but production never reached $GITHUB_SHA."; exit 1

      - name: Verify deploy chain
        run: npm run verify:deploy -- ${{ github.sha }}
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip netlify]')
      - run: npx playwright install --with-deps chromium
      - name: Production smoke (routes, delivery, ad destinations)
        run: npm run test:smoke
      - name: Full client-side audit against production (daily / manual)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 5 * * *'
        run: npm run test:prod-audit
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 90
          if-no-files-found: ignore
