# Funnel test suite. Guards the money path (pin click → subscriber → PDF).
# Runs headless invariants + the built-artifact e2e on every push/PR.
#
# Deliberately NOT here (run by a human before/after a flight):
#   • npm run test:smoke      — hits live production (Layer 1/5/6.1 pre-flight)
#   • RUN_LIVE_SIGNUP=1 …     — writes a real MailerLite subscriber (Layer 3.6)
name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # match Netlify production (netlify.toml NODE_VERSION)
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck           # tsc -b over both projects; plain tsc on the references-only root checked nothing
      - run: npm run check:content        # S7-014: ecosystem references, validators, downloads on disk
      - run: npm run check:audit          # S8-014: high/critical advisories block unless allowlisted with a live review date
      - run: npm test                       # Layer 0 + 2.5 + 7 (headless, no browser)
      - run: npm run build                  # proves the prerender abort guard + builds dist/
      - run: npm run check:budgets        # S8-021: JS/CSS/HTML/image/PDF budgets against the built dist/
      - run: npm run check:secrets        # S8-016: no secret names or token-shaped strings in dist/
      - run: npm run test:seo               # per-route SEO assertions against prerendered dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=local   # Layers 2, 3, 4 against the built artifact
