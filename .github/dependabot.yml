# S8-014 dependency policy: grouped, weekly for minors/patches, monthly for majors.
# Nothing auto-merges; the full CI suite is the gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    target-branch: main
    labels: [dependencies, major]
    groups:
      majors:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
